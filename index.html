<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Drop-in-Coin</title>

  <!-- ▼ ブラウザタブ用 (Favicon) 設定 ▼ -->
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="shortcut icon" href="icon.png" type="image/png">
  <!-- ▲ ブラウザタブ用 (Favicon) 設定 ▲ -->

  <!-- ▼ ホーム画面用 (apple-touch-icon) ▼ -->
  <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon.png">
  <!-- ▲ ホーム画面用 (apple-touch-icon) ▲ -->

  <!-- ▼ PWA (ホーム画面から起動した際にアプリらしく表示) ▼ -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d0f1d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ドロップinコイン">
  <!-- ▲ PWA設定 ▲ -->

  <style>
    /* 画面全体にGASアプリを隙間なく表示する設定 */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #0b0e14; /* ゲーム画面の背景色に合わせて、余白が目立たないようにする */
    }

    /* ▼ Safe Area（ノッチ／ホームバー避け）は内側のGASアプリ側(#app)で
       既に処理しているため、ここでは追加のpaddingを入れない
       （二重に余白を入れると上下にオレンジの帯が見えてしまう） ▼ */

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <!-- GASのWebアプリURL（画面全体に表示） -->
  <iframe src="https://script.google.com/macros/s/AKfycbxm5xAR-2qiSsSGMgKKUpvSUuJeo84_lWIgQU0wJQbB-v4iv0HPh22lciU9bK48YBcO/exec"></iframe>

  <script>
    // PWA: Service Workerを登録（トップレベルページで登録することが重要）
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('service-worker.js').catch(function (err) {
          console.warn('Service Worker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>

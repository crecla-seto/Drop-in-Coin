<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BGM & 効果音 テスト</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      gap: 20px;
      background-color: #f4f4f4;
    }
    button {
      font-size: 18px;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    #start-btn {
      background-color: #4CAF50;
      color: white;
    }
    #start-btn:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    #coin-btn {
      background-color: #FFC107;
      color: #333;
    }
  </style>
</head>
<body>

  <h1>Webゲーム画面</h1>
  
  <!-- ボタン領域 -->
  <button id="start-btn">ゲームスタート（BGM再生）</button>
  <button id="coin-btn">コインを落とす（効果音）</button>

  <script>
    // --------------------------------------------------
    // 1. 音声ファイルの読み込み設定
    // ※ GitHub上のファイル名（大文字・小文字）と正確に合わせてください
    // ※ パスの先頭に "/" はつけないでください（例: 'bgm.mp3' や './bgm.mp3'）
    // --------------------------------------------------
    const bgm = new Audio('bgm.mp3');
    const coinSe = new Audio('coin.mp3'); // 効果音のファイル名に合わせて変更してください

    // BGMのループ再生を有効化
    bgm.loop = true;

    // --------------------------------------------------
    // 2. HTML要素の取得
    // --------------------------------------------------
    const startBtn = document.getElementById('start-btn');
    const coinBtn = document.getElementById('coin-btn');

    // --------------------------------------------------
    // 3. スタートボタンを押したときの処理（BGMの再生）
    // --------------------------------------------------
    startBtn.addEventListener('click', () => {
      // ブラウザの自動再生規制を回避するため、クリックイベント内でplay()を実行
      bgm.play().then(() => {
        console.log('BGMの再生を開始しました');
        startBtn.textContent = '再生中…';
        startBtn.disabled = true; // 二重再生防止のためボタンを無効化
      }).catch(error => {
        console.error('BGMの再生に失敗しました:', error);
        alert('BGMが見つからないか、再生できませんでした。ファイル名や配置場所を確認してください。');
      });
    });

    // --------------------------------------------------
    // 4. コインボタンを押したときの処理（効果音の再生）
    // --------------------------------------------------
    coinBtn.addEventListener('click', () => {
      // 連続で押された場合も最初から再生し直す（再生位置をリセット）
      coinSe.currentTime = 0;
      
      coinSe.play().catch(error => {
        console.error('効果音の再生に失敗しました:', error);
      });
    });
  </script>

</body>
</html>
